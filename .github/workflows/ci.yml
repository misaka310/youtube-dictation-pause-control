name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify JavaScript and JSON
        run: npm run check
      - name: Run all tests
        run: npm test
      - name: Build self-contained Windows package
        shell: powershell
        run: ./scripts/windows/build-release.ps1
