name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate tag and package version
        shell: powershell
        run: ./scripts/windows/validate-release-tag.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Run all tests
        run: npm test
      - name: Build self-contained Windows package
        shell: powershell
        run: ./scripts/windows/build-release.ps1
      - name: Prepare release assets
        shell: powershell
        run: |
          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $zipPath = "dist\YouTubeDictationPauseControl-$($package.version)-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Release ZIP was not created: $zipPath"
          }
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = 'dist\SHA256SUMS.txt'
          "$zipHash  $([System.IO.Path]::GetFileName($zipPath))" | Set-Content -LiteralPath $checksumPath -Encoding ascii
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $zipPath = "dist\YouTubeDictationPauseControl-$($package.version)-windows-x64.zip"
          $checksumPath = 'dist\SHA256SUMS.txt'
          $ghPath = (Get-Command gh.exe -ErrorAction Stop).Source
          $probeStdout = Join-Path $env:RUNNER_TEMP 'gh-release-view.stdout.txt'
          $probeStderr = Join-Path $env:RUNNER_TEMP 'gh-release-view.stderr.txt'
          Remove-Item -LiteralPath $probeStdout, $probeStderr -Force -ErrorAction SilentlyContinue
          $releaseProbe = Start-Process -FilePath $ghPath -ArgumentList @('release', 'view', $tag) -RedirectStandardOutput $probeStdout -RedirectStandardError $probeStderr -NoNewWindow -Wait -PassThru
          $releaseExists = ($releaseProbe.ExitCode -eq 0)
          if ($releaseExists) {
            gh release upload $tag $zipPath $checksumPath --clobber
          } else {
            gh release create $tag $zipPath $checksumPath --verify-tag --generate-notes --title "YouTube Dictation Pause Control $tag"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed with exit code $LASTEXITCODE."
          }
